name: Dependency Review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          # Accepted, scoped risk: GHSA-vfmq-68hx-4jfw (lxml < 6.1.0, high).
          #
          # lxml reaches this repository only as a transitive dependency of
          # browsergym-core, behind the optional `miniwob` extra of
          # benchmarks/browser-agent. It is never installed by the published
          # CLI or the Python SDK, so no shipped artifact carries it.
          #
          # It cannot currently be patched: browsergym-core==0.14.3 requires
          # lxml>=4.9,<6.0.0, the advisory is first patched in 6.1.0, and the
          # browsergym version is frozen by the pre-registered benchmark
          # manifests that `pnpm benchmark:browser:verify-upstream` enforces.
          # Raising it would invalidate the registered upstream selection.
          #
          # The exposure is XXE via iterparse()/ETCompatXMLParser() on
          # attacker-controlled XML. The harness parses pages served by a local
          # MiniWoB instance on a developer machine, not untrusted input.
          #
          # Revisit when browsergym-core relaxes its lxml cap: re-register the
          # benchmark upstream pins, then delete this entry. The allowance is
          # deliberately a single GHSA, so any other advisory in the benchmark
          # dependency tree still fails this gate.
          allow-ghsas: GHSA-vfmq-68hx-4jfw
