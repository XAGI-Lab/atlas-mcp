name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 9.5.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.11"
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm security:audit
      - run: pnpm evals
      - name: Validate tag and package versions
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          test "${GITHUB_REF_NAME}" = "v${version}"
      - name: Build release artifacts
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          mkdir -p release/node release/python
          pnpm deploy --filter @melra/cli --prod release/node
          cp LICENSE NOTICE README.md release/node/
          tar -C release/node -czf \
            "${GITHUB_WORKSPACE}/release/melra-node-${version}.tar.gz" .
          uv build sdk-py --out-dir release/python --no-create-gitignore
          mv release/python/* release/
          rmdir release/python
          git archive --format=tar.gz --prefix="melra-${version}/" \
            --output="release/melra-source-${version}.tar.gz" HEAD
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: release/node
          format: spdx-json
          output-file: release/melra.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Create checksums
        shell: bash
        run: |
          cd release
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
            | sort -z | xargs -0 sha256sum > SHA256SUMS
      - name: Attest release artifacts
        uses: actions/attest@v4
        with:
          subject-checksums: release/SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          prerelease=""
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "${GITHUB_REF_NAME}" \
            release/*.tar.gz release/*.whl release/*.json release/SHA256SUMS \
            --verify-tag --generate-notes ${prerelease}

  container:
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: xagi-lab/melra
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:alpha
      - uses: actions/attest@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
