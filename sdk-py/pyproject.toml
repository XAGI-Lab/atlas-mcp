[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "atlas-mcp"
version = "0.2.0a1"
description = "Python client SDK for ATLAS MCP."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "XAGI Labs Private Limited" }]
dependencies = ["mcp==1.28.1"]

[project.urls]
Repository = "https://github.com/XAGI-Lab/atlas-mcp"
Documentation = "https://github.com/XAGI-Lab/atlas-mcp#readme"

[dependency-groups]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1,<2",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
